name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: MCP stdio smoke test (built server)
        run: node scripts/mcp_smoke.mjs
      - name: Installed package works (npm pack → install → MCP smoke)
        run: node scripts/pack_smoke.mjs
      - name: HexaCore audits its own architecture (no errors, no warnings)
        run: npx tsx src/cli/hexacore_cli.ts arch src --strict

  # Proof that the learning loop works on a real project: break and fix a generated Go slice and
  # require episodes, lessons, diff-backed credit, skill export and the cross-project library to work.
  e2e-learning-loop:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: npm ci
      - run: npm run build
      - name: Learning loop on a real Go project (scripts/e2e_learning.mjs)
        run: node scripts/e2e_learning.mjs

  # Proof that UI prototyping works with a real browser: a page that only breaks on a phone is caught,
  # fixed, learned from (lesson offered and credited on the next prototype) and promoted.
  e2e-ui-prototyping:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: UI prototyping with Chromium (scripts/e2e_ui.mjs)
        run: node scripts/e2e_ui.mjs

  # Proof that generated slices are real code: scaffold into a minimal host project and
  # require each stack's own compiler + test runner to pass (scripts/e2e_stack.mjs).
  e2e-generated-code:
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        stack: [node, react, reactnative, python, go, rust, dotnet, laravel, ruby, elixir, flutter]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm ci

      - if: matrix.stack == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: matrix.stack == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - if: matrix.stack == 'rust'
        uses: dtolnay/rust-toolchain@stable
      - if: matrix.stack == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - if: matrix.stack == 'laravel'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - if: matrix.stack == 'ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - if: matrix.stack == 'elixir'
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.18'
      - if: matrix.stack == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Scaffold + compile + test generated slices (${{ matrix.stack }})
        run: node scripts/e2e_stack.mjs ${{ matrix.stack }}
